<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15803d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>

  <text x="640" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Pharmacy Bill Agent — Architecture</text>
  <text x="640" y="58" text-anchor="middle" font-size="13" fill="#64748b">Gmail watch → Pub/Sub → Cloud Run agent loop → toolbox → Firestore / Drive / WhatsApp, with the resume entrypoint</text>

  <!-- Vendor email -->
  <rect x="30" y="110" width="160" height="60" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Vendor</text>
  <text x="110" y="153" text-anchor="middle" font-size="12" fill="#475569">emails a bill</text>

  <!-- Gmail -->
  <rect x="250" y="110" width="160" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="330" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">Gmail</text>
  <text x="330" y="153" text-anchor="middle" font-size="12" fill="#7f1d1d">watch + push</text>

  <!-- Pub/Sub -->
  <rect x="470" y="110" width="160" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="135" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Pub/Sub</text>
  <text x="550" y="153" text-anchor="middle" font-size="12" fill="#1e3a8a">push notification</text>

  <line x1="190" y1="140" x2="248" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="410" y1="140" x2="468" y2="140" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Cloud Run: Agent Loop -->
  <rect x="470" y="220" width="300" height="110" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="245" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Cloud Run: Agent Loop</text>
  <text x="620" y="264" text-anchor="middle" font-size="12" fill="#1e3a8a">Gemini 3.5 Flash via Vertex AI</text>
  <text x="620" y="280" text-anchor="middle" font-size="12" fill="#1e3a8a">orchestrated with Google ADK</text>
  <text x="620" y="300" text-anchor="middle" font-size="11" fill="#3b5bab">each turn: inspect state → pick a tool → observe → decide</text>

  <line x1="550" y1="170" x2="550" y2="218" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Toolbox -->
  <rect x="850" y="220" width="380" height="150" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
  <text x="1040" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Toolbox</text>
  <text x="875" y="264" font-size="11.5" fill="#334155">detect_format · parse_csv / parse_xls / parse_pdf_vision</text>
  <text x="875" y="282" font-size="11.5" fill="#334155">lookup_vendor_history · check_duplicate</text>
  <text x="875" y="300" font-size="11.5" fill="#334155">check_price_deviation · cross_check_other_vendors</text>
  <text x="875" y="318" font-size="11.5" fill="#334155">record_purchase · stage_file</text>
  <text x="875" y="336" font-size="11.5" fill="#334155">email_vendor · notify_pharmacist / ask_pharmacist</text>
  <text x="875" y="354" font-size="11.5" fill="#334155">record_pharmacist_resolution</text>

  <line x1="770" y1="255" x2="848" y2="255" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="809" y="248" text-anchor="middle" font-size="10" fill="#64748b">selects a tool</text>
  <line x1="848" y1="300" x2="770" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="809" y="316" text-anchor="middle" font-size="10" fill="#64748b">tool result</text>

  <!-- external systems the toolbox touches -->
  <rect x="900" y="420" width="110" height="50" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="955" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#312e81">Firestore</text>

  <rect x="1030" y="420" width="110" height="50" rx="8" fill="#ecfdf5" stroke="#0d9488" stroke-width="1.5"/>
  <text x="1085" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">Drive</text>

  <rect x="1160" y="420" width="105" height="50" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="1212" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">WhatsApp</text>

  <line x1="960" y1="370" x2="960" y2="418" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1075" y1="370" x2="1085" y2="418" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1150" y1="370" x2="1205" y2="418" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1085" y="400" text-anchor="middle" font-size="10" fill="#64748b">purchase ledger, dedupe, resolutions</text>

  <!-- Terminal state -->
  <rect x="470" y="400" width="300" height="70" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="620" y="426" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">Terminal state reached</text>
  <text x="620" y="446" text-anchor="middle" font-size="11.5" fill="#78350f">resolved · pending_pharmacist · pending_vendor</text>

  <line x1="620" y1="330" x2="620" y2="398" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- resolved branch -->
  <rect x="130" y="410" width="220" height="50" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="240" y="432" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">resolved</text>
  <text x="240" y="449" text-anchor="middle" font-size="11" fill="#14532d">no human involved</text>
  <line x1="470" y1="428" x2="352" y2="428" stroke="#15803d" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- pending branch down to serialize -->
  <rect x="470" y="510" width="300" height="60" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="620" y="534" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">pending_pharmacist / pending_vendor</text>
  <text x="620" y="552" text-anchor="middle" font-size="11" fill="#7f1d1d">state serialized to Firestore (agent_runs)</text>
  <line x1="620" y1="470" x2="620" y2="508" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="960" y1="470" x2="700" y2="516" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- reply -->
  <rect x="470" y="610" width="300" height="60" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/>
  <text x="620" y="634" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Pharmacist WhatsApp reply</text>
  <text x="620" y="652" text-anchor="middle" font-size="11" fill="#334155">— or a vendor's resend email —</text>
  <line x1="620" y1="570" x2="620" y2="608" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Resume entrypoint -->
  <rect x="450" y="710" width="340" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="620" y="736" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Resume Entrypoint</text>
  <text x="620" y="755" text-anchor="middle" font-size="11.5" fill="#1e3a8a">separate Cloud Run service — webhook</text>
  <text x="620" y="773" text-anchor="middle" font-size="11.5" fill="#1e3a8a">match correlation key → rehydrate state → continue</text>
  <line x1="620" y1="670" x2="620" y2="708" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- loop back to agent loop: rectilinear, routed down the far-left margin
       so it can't cross the resolved/toolbox/terminal-state boxes -->
  <path d="M 450 755 L 40 755 L 40 275 L 468 275" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowBlue)"/>
  <text x="60" y="515" text-anchor="middle" font-size="11" fill="#1e3a8a" transform="rotate(-90 60 515)">continues the loop from the paused turn</text>

  <!-- legend -->
  <g transform="translate(870,610)">
    <rect x="0" y="0" width="360" height="150" rx="10" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#0f172a">Legend</text>
    <rect x="14" y="34" width="16" height="16" rx="3" fill="#eff6ff" stroke="#2563eb"/>
    <text x="38" y="47" font-size="11.5" fill="#334155">Google Cloud (Cloud Run / Pub/Sub / Vertex AI)</text>
    <rect x="14" y="58" width="16" height="16" rx="3" fill="#eef2ff" stroke="#4338ca"/>
    <text x="38" y="71" font-size="11.5" fill="#334155">Firestore (bills, purchase_ledger, agent_runs, resolutions)</text>
    <rect x="14" y="82" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#0d9488"/>
    <text x="38" y="95" font-size="11.5" fill="#334155">Google Drive (per-vendor staged files)</text>
    <rect x="14" y="106" width="16" height="16" rx="3" fill="#f0fdf4" stroke="#15803d"/>
    <text x="38" y="119" font-size="11.5" fill="#334155">WhatsApp (Meta Cloud API) — pharmacist channel</text>
    <rect x="14" y="130" width="16" height="16" rx="3" fill="#fef2f2" stroke="#dc2626"/>
    <text x="38" y="143" font-size="11.5" fill="#334155">Gmail (inbound bills, outbound vendor mail)</text>
  </g>
</svg>
